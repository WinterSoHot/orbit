name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS Intel tests and build
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      RUSTUP_TOOLCHAIN: '1.98.0'
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Set up Rust and verify tools
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustc -Vv
          cargo -V
          python3 --version
      - name: Install frontend dependencies
        run: npm ci
      - name: Test frontend
        run: npm test
      - name: Build frontend and desktop app
        run: npm run tauri -- build --debug --bundles app -- --locked
      - name: Test Rust
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Package app
        run: |
          test -d src-tauri/target/debug/bundle/macos/Orbit.app
          ditto -c -k --sequesterRsrc --keepParent src-tauri/target/debug/bundle/macos/Orbit.app "Orbit-macos-${RUNNER_ARCH}.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Orbit-macos-${{ runner.arch }}
          path: Orbit-macos-*.zip
          if-no-files-found: error
          retention-days: 7
